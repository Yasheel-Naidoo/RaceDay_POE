name: RaceDay Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Solution Dependencies
      run: dotnet restore RaceDay.sln

    - name: Build Complete Solution (API, MVC & Tests)
      run: dotnet build RaceDay.sln --no-restore --configuration Release

    - name: Run xUnit Test Suite
      run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal

    - name: Validate MVC Dockerfile Build
      run: docker build -t raceday-mvc:test -f src/RaceDay.Mvc/Dockerfile .

    - name: Validate API Dockerfile Build
      run: docker build -t raceday-api:test -f src/RaceDay.Api/Dockerfile .